name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-check:
    name: Go 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 运行测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 运行静态检查
        run: go vet ./...

      - name: 编译后端
        run: go build -buildvcs=false -o /tmp/solvify-agent ./cmd/server

  frontend-check:
    name: Vue 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/vue
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design/vue/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

  deployment-check:
    name: 部署配置检查（k3s 清单）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查 Shell 语法
        run: bash -n deploy/k3s/apply.sh

      - name: 校验 k3s 清单（YAML 语法 + 结构，无需集群）
        run: |
          # kubectl apply 即使 --validate=false 仍会连 API Server 做 discovery，runner 无集群会失败；
          # 这里改用 PyYAML 纯本地解析，校验每个清单可解析且含 apiVersion/kind。
          python3 -m venv /tmp/solvify-venv
          /tmp/solvify-venv/bin/pip install --quiet pyyaml
          /tmp/solvify-venv/bin/python - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob("deploy/k3s/*.yaml"))
          if not files:
              print("错误：deploy/k3s 下没有 .yaml 清单")
              sys.exit(1)
          total = 0
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  docs = [d for d in yaml.safe_load_all(fh) if d is not None]
              for d in docs:
                  if not (isinstance(d, dict) and d.get("apiVersion") and d.get("kind")):
                      print(f"错误：{f} 存在缺少 apiVersion/kind 的文档")
                      sys.exit(1)
                  print(f"OK  {f}  ->  {d['apiVersion']}  {d['kind']}")
                  total += 1
          print(f"共校验 {len(files)} 个文件 / {total} 个资源，全部通过")
          PY

  images:
    name: 构建并发布镜像
    runs-on: ubuntu-latest
    needs:
      - go-check
      - frontend-check
      - deployment-check
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.image-names.outputs.backend }}
      frontend-image: ${{ steps.image-names.outputs.frontend }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 生成镜像名称
        id: image-names
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          user="${DOCKERHUB_USERNAME,,}"
          echo "backend=docker.io/${user}/solvify-agent-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=docker.io/${user}/solvify-agent-frontend" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建后端镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image-names.outputs.backend }}:${{ github.sha }}
            ${{ steps.image-names.outputs.backend }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: 构建前端镜像
        uses: docker/build-push-action@v7
        with:
          context: design/vue
          file: design/vue/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image-names.outputs.frontend }}:${{ github.sha }}
            ${{ steps.image-names.outputs.frontend }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: 部署生产环境
    runs-on: ubuntu-latest
    needs:
      - images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: solvify-agent-production
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          install -d -m 0700 "$HOME/.ssh"
          # 去除 Windows CRLF（\r）：否则 OpenSSH 加载私钥报 "error in libcrypto"、known_hosts 也可能对不上
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/solvify_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/solvify_deploy" "$HOME/.ssh/known_hosts"

          # 校验私钥可被 OpenSSH 解析（失败给出清晰提示，而非后面模糊的 publickey）
          ssh-keygen -y -P "" -f "$HOME/.ssh/solvify_deploy" > /dev/null 2>&1 || {
            echo "DEPLOY_SSH_KEY 私钥无法解析：请确认完整粘贴了私钥（含 -----BEGIN/END----- 两行、中间无多余换行/空格）"
            exit 1
          }

          {
            echo "Host solvify-production"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/solvify_deploy"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

          ssh solvify-production "printf 'SSH 连接成功\n'"

      - name: 渲染并上传 k3s 清单
        env:
          BACKEND_IMAGE: ${{ needs.images.outputs.backend-image }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend-image }}:${{ github.sha }}
          RELEASE_DIR: /opt/solvify-agent/releases/${{ github.sha }}/k3s
        run: |
          WORK_DIR="${{ runner.temp }}/solvify-k3s"
          mkdir -p "$WORK_DIR"
          cp -r deploy/k3s/* "$WORK_DIR/"
          cp scripts/init_knowledge_schema.sql "$WORK_DIR/" 2>/dev/null || true
          # 把镜像 SHA 标签渲染进后端/前端清单
          envsubst < "$WORK_DIR/05-backend.yaml" > "$WORK_DIR/05-backend.rendered.yaml"
          mv "$WORK_DIR/05-backend.rendered.yaml" "$WORK_DIR/05-backend.yaml"
          envsubst < "$WORK_DIR/06-frontend.yaml" > "$WORK_DIR/06-frontend.rendered.yaml"
          mv "$WORK_DIR/06-frontend.rendered.yaml" "$WORK_DIR/06-frontend.yaml"
          tar -C "$WORK_DIR" -czf "${{ runner.temp }}/solvify-k3s.tar.gz" .
          ssh solvify-production "mkdir -p '$RELEASE_DIR'"
          scp "${{ runner.temp }}/solvify-k3s.tar.gz" "solvify-production:$RELEASE_DIR/k3s.tar.gz"
          ssh solvify-production \
            "tar -xzf '$RELEASE_DIR/k3s.tar.gz' -C '$RELEASE_DIR' \
            && rm -f '$RELEASE_DIR/k3s.tar.gz'"

      - name: 应用 k3s 清单
        env:
          RELEASE_DIR: /opt/solvify-agent/releases/${{ github.sha }}/k3s
        run: |
          ssh solvify-production "RELEASE_DIR='$RELEASE_DIR' bash -s" <<'EOF'
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            # 数据库初始化 SQL（首次建表，已存在则跳过）
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent create configmap pg-init \
              --from-file=001-init-schema.sql="$RELEASE_DIR/init_knowledge_schema.sql" \
              -o yaml --dry-run=client | sudo KUBECONFIG="$KUBECONFIG" kubectl apply -f - || true
            sudo KUBECONFIG="$KUBECONFIG" kubectl apply -f "$RELEASE_DIR/00-namespace.yaml"
            # 密钥只在首次（集群里还不存在时）创建，避免覆盖手动设置的真实密钥。
            # 真实密钥请用仓库外的 deploy/k3s/01-secrets.local.yaml 手动 apply 一次。
            if ! sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent get secret solvify-secrets >/dev/null 2>&1; then
              sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f "$RELEASE_DIR/01-secrets.yaml"
            else
              echo "secret solvify-secrets 已存在，跳过（不覆盖手动设置的真实密钥）"
            fi
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f "$RELEASE_DIR/02-configmap.yaml"
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f "$RELEASE_DIR/03-postgres.yaml"
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f "$RELEASE_DIR/04-redis.yaml"
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f "$RELEASE_DIR/05-backend.yaml"
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f "$RELEASE_DIR/06-frontend.yaml"
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent rollout status deployment/backend --timeout=180s
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent rollout status deployment/frontend --timeout=180s
          EOF

      - name: 外部健康检查
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          health_base_url="${PRODUCTION_URL:-http://${DEPLOY_HOST}:18888}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 \
              "${health_base_url%/}/health" >/dev/null; then
              echo "生产环境健康检查通过"
              exit 0
            fi
            echo "等待生产环境健康检查，第 ${attempt} 次"
            sleep 5
          done
          echo "生产环境外部健康检查失败" >&2
          exit 1
